name: Check server auto-updater

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'deploy/**', '.github/workflows/check-server-updater.yml']
  pull_request:
    paths: ['server/**', 'deploy/**', '.github/workflows/check-server-updater.yml']

permissions:
  contents: read

concurrency:
  group: pocket-updater-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Check Windows updater without changing Docker or scheduled tasks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(Get-ChildItem -LiteralPath deploy/tests -Filter '*.Tests.ps1' -File)
          if ($tests.Count -eq 0) { throw 'No updater tests found.' }
          foreach ($test in $tests) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed: $($test.Name)" }
          }
      - name: Check family API
        shell: powershell
        run: |
          node --test server/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
